name: Deploy to Firebase

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    # Runs wherever the Pi's router sends it (the Pi, the Mac or GitHub's
    # cloud) via CI_RUNS_ON; unset, it is the Pi exactly as before. The
    # job-slot steps below only run on the Pi.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","ARM64"]') }}
    
    steps:
      - name: Wait for the Pi's single job slot
        # One job at a time on each machine (the Pi, and the Mac), handed out by
        # priority: P0 deploy > P1 test > P2 heavy check, then first come first served.
        # GitHub's `concurrency:` only serialises within one repo, so the gate lives
        # here. ci-slot.py is the queue (master copy ~/homelab/scripts/ci-slot.py on
        # the Pi, installed at /tmp/ci-queue there and in ~/actions-runners on the
        # Mac): it frees a slot whose job is gone and never breaks one that is alive.
        # The bare mkdir loop is only a fallback for a machine without the script.
        if: runner.environment == 'self-hosted'
        run: |
          S=/tmp/ci-queue/ci-slot.py; [ "$RUNNER_OS" = macOS ] && S="$HOME/actions-runners/ci-slot.py"
          if [ -f "$S" ]; then
            python3 "$S" acquire --class P0 --pid "$PPID"
          else
            SLOT=/mnt/t7/actions-runner/.jobslot; [ "$RUNNER_OS" = macOS ] && SLOT="$HOME/actions-runners/.jobslot"
            until mkdir "$SLOT" 2>/dev/null; do
              h="$(cat "$SLOT/pid" 2>/dev/null || true)"
              if [ -n "$h" ] && ! kill -0 "$h" 2>/dev/null; then rm -rf "$SLOT"; fi
              sleep 5
            done
            echo "$GITHUB_REPOSITORY $GITHUB_RUN_ID $(date +%Y-%m-%dT%H:%M:%S%z)" > "$SLOT/owner"; echo "$PPID" > "$SLOT/pid"
          fi
      - uses: actions/checkout@v4
      
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: scan-a-bin
      - name: Release the Pi's job slot
        # always() so a failed or cancelled job frees the slot for the next one.
        # Only if it is ours: the pid file names the job that took it.
        if: always() && runner.environment == 'self-hosted'
        run: |
          S=/tmp/ci-queue/ci-slot.py; [ "$RUNNER_OS" = macOS ] && S="$HOME/actions-runners/ci-slot.py"
          if [ -f "$S" ]; then python3 "$S" release --pid "$PPID"; exit 0; fi
          SLOT=/mnt/t7/actions-runner/.jobslot; [ "$RUNNER_OS" = macOS ] && SLOT="$HOME/actions-runners/.jobslot"
          if [ "$(cat "$SLOT/pid" 2>/dev/null || true)" = "$PPID" ]; then rm -rf "$SLOT"; fi
